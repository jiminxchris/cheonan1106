function fullscreen(){if(document.fullscreenElement){document.exitFullscreen?.()}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{document.body.classList.toggle('fullscreen')})}else{document.body.classList.toggle('fullscreen')}}$('fullscreenBtn').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));
document.addEventListener('keydown',e=>{if(e.target.matches('button')&&(e.key===' '||e.key==='Enter'))return;if(e.key==='Escape'){toggleDetails(false);closeMenu();if(document.body.classList.contains('fullscreen')&&!document.fullscreenElement)document.body.classList.remove('fullscreen');return}if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(9)}else if(e.key.toLowerCase()==='f'){fullscreen()}else if(e.key.toLowerCase()==='i'){toggleDetails()}});
$('stage').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<7&&Math.abs(e.deltaX)<7)return;e.preventDefault();if(scrollLock)return;go(current+(e.deltaY>0||e.deltaX>0?1:-1));scrollLock=true;setTimeout(()=>scrollLock=false,620)},{passive:false});$('stage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});$('stage').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)go(current+(dx<0?1:-1));startX=null},{passive:true});$('progress').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/r.width*10))});$('progress').addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);else if(e.key==='ArrowLeft')go(current-1)});
let requested=Number(location.hash.match(/slide-(\d+)/)?.[1]);if(requested>=1&&requested<=10){current=requested-1;Array.from(images.children).forEach((im,i)=>im.classList.toggle('active',i===current))}update();
</script></body></html>
